name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, without the v prefix (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      publish:
        description: 'Create a GitHub Release even without a tag'
        type: boolean
        default: false

permissions:
  contents: write

# Do not cancel an in-progress tag/release run when a branch push arrives.
# A cancelled macOS job previously forced a manual release with stale pkg
# metadata. Let runs finish; serialise tag pushes instead to limit runner
# contention.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="1.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building RapidEditor $V"

  # One job produces the x64, arm64 and universal NSIS installers. Both
  # payloads are built with MSVC (required by the WebView2 C++ COM bridge):
  # x64 natively and ARM64 via the VS cross toolchain on the x64 runner.
  windows:
    needs: meta
    # windows-latest now resolves to the 2025 image, which no longer ships
    # NSIS and whose Chocolatey feed has been failing the install step.
    # The 2022 image has NSIS 3.10 preinstalled and the same MSVC cross
    # toolchain used by the successful v1.3.4 release.
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe",
            "$env:LOCALAPPDATA\Programs\NSIS\makensis.exe"
          )
          function Find-Makensis {
            $hit = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if ($hit) { return $hit }
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd -and (Test-Path $cmd.Source)) { return $cmd.Source }
            return $null
          }
          $exe = Find-Makensis
          if (-not $exe) {
            # The Chocolatey community feed occasionally returns 503. Retry a
            # few times instead of letting one transient failure abort the
            # whole release (see v1.2.12 first attempt).
            $installed = $false
            for ($i = 1; $i -le 4 -and -not $installed; $i++) {
              Write-Host "Chocolatey NSIS install attempt $i/4"
              choco install nsis -y --no-progress --limit-output
              if ($LASTEXITCODE -eq 0) { $installed = $true }
              else { Start-Sleep -Seconds 15 }
            }
            # PATH changes from choco only apply to new processes, so re-scan
            # the known install locations rather than relying on Get-Command.
            $exe = Find-Makensis
          }
          if (-not $exe) { throw 'makensis.exe not found after install attempts' }
          (Split-Path $exe -Parent) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using makensis: $exe"
          & $exe -VERSION

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64 payload (MSVC)
        shell: pwsh
        run: |
          cmake -S . -B build-win-x64 -G Ninja -DRE_TARGET_ARCH=x64 `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win-x64 --parallel
          if (-not (Test-Path 'build-win-x64/RapidEditor.exe')) {
            throw 'x64 build did not produce RapidEditor.exe'
          }
          if (-not (Test-Path 'build-win-x64/WebView2Loader.dll')) {
            throw 'x64 build did not stage WebView2Loader.dll'
          }

      - name: Set up MSVC ARM64 (cross)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Build ARM64 payload (MSVC cross)
        id: arm64
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S . -B build-win-arm64 -G Ninja -DRE_TARGET_ARCH=arm64 `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win-arm64 --parallel
          if (-not (Test-Path 'build-win-arm64/RapidEditor.exe')) {
            throw 'arm64 build did not produce RapidEditor.exe'
          }

      - name: Create NSIS installers
        shell: pwsh
        run: |
          $x64 = Join-Path (Get-Location) 'build-win-x64/RapidEditor.exe'
          $arm = Join-Path (Get-Location) 'build-win-arm64/RapidEditor.exe'
          if (-not (Test-Path $arm)) {
            Write-Warning 'ARM64 cross build unavailable; producing x64-only installer.'
            $arm = '-'
          }
          cmd /c "packaging\windows\make_installers.bat $env:VERSION `"$x64`" `"$arm`""
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }
          Get-ChildItem dist\*.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: rapideditor-windows
          path: dist/*.exe
          if-no-files-found: error

  # A single universal binary (x86_64 + arm64 slices) means one .pkg works on
  # Intel and Apple Silicon Macs with no architecture decision by the user.
  macos:
    needs: meta
    runs-on: macos-15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Ninja
        run: command -v ninja >/dev/null 2>&1 || brew install ninja
      - name: Build universal .pkg
        run: |
          bash packaging/macos/build_pkg.sh "$VERSION" universal
          ls -lh dist/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: rapideditor-macos
          path: dist/*.pkg
          if-no-files-found: error

  # An AppImage runtime is single-architecture, so build one per runner.
  # install-linux.sh (attached to the release) picks the right one by uname -m.
  linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      RE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ pkg-config libx11-dev libgl1-mesa-dev libxcursor-dev \
            libxinerama-dev libxi-dev squashfs-tools curl \
            libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build AppImage
        run: bash packaging/linux/build_appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: rapideditor-linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  # Android builds. The in-app updater (np_updater.c) downloads exactly the
  # arm64 asset from the release, so the APK must carry the release version
  # and the committed signing key (updates refuse a different signature).
  # x86_64 targets emulator hosts (e.g. MuMu) where ARM translation is slow.
  android:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gradle/NDK ABI names; the release asset keeps the short name.
          - abi: arm64-v8a
            asset: arm64
          - abi: x86_64
            asset: x86_64
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      RE_ABI: ${{ matrix.abi }}
      RE_ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch SDL2 source
        run: |
          curl -fsSL -o /tmp/sdl2.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          mkdir -p "$RUNNER_TEMP/sdl2"
          tar -xzf /tmp/sdl2.tar.gz -C "$RUNNER_TEMP/sdl2" --strip-components=1
          echo "RE_SDL2_SOURCE=$RUNNER_TEMP/sdl2" >> "$GITHUB_ENV"
      - name: Build signed APK (${{ matrix.abi }})
        run: |
          cd android
          gradle assembleRelease -PRE_VERSION="$VERSION" -PRE_ABIS="$RE_ABI" -PRE_SDL2_SOURCE="$RE_SDL2_SOURCE"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk \
             ../dist/RapidEditor-${VERSION}-android-${RE_ASSET}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rapideditor-android-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [meta, windows, macos, linux, android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the adaptive Linux installer
        run: |
          cp packaging/linux/install.sh dist/install-linux.sh
          chmod +x dist/install-linux.sh
          ls -lh dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.meta.outputs.version) }}
          name: RapidEditor ${{ needs.meta.outputs.version }}
          files: |
            dist/*.exe
            dist/*.pkg
            dist/*.AppImage
            dist/*.apk
            dist/install-linux.sh
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
